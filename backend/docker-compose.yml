services:
  postgres:
    image: postgres:16-alpine
    container_name: hamilton-postgres
    environment:
      POSTGRES_DB: hamilton
      POSTGRES_USER: hamilton
      POSTGRES_PASSWORD: hamilton
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamilton -d hamilton"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hamilton-redis
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
